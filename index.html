<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Agent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d0d10;
      background-image: radial-gradient(ellipse 60% 40% at 80% 10%, #2a0d0d 0%, transparent 70%);
      color: #ffffff;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .page-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      width: 50%;
      margin: 0 auto;
      min-width: 400px;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }

    header h1 {
      font-size: 15px;
      font-weight: 600;
      color: #e8e8e8;
    }

    .brain-icon {
      font-size: 18px;
    }

    /* Session controls */
    .session-bar {
      display: flex;
      gap: 8px;
      margin-left: auto;
      align-items: center;
    }

    .session-bar label {
      font-size: 11px;
      color: #666;
      margin-right: 2px;
    }

    .session-bar input {
      background: #1c1c22;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      color: #ccc;
      font-size: 12px;
      padding: 4px 8px;
      width: 120px;
      outline: none;
    }

    .session-bar input:focus {
      border-color: rgba(255,255,255,0.2);
    }

    #ok-btn {
      background: #7a1f1f;
      border: none;
      border-radius: 7px;
      color: #f0e8e8;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 14px;
      cursor: pointer;
      transition: background 0.15s;
      font-family: inherit;
    }

    #ok-btn:hover { background: #8f2525; }
    #ok-btn:active { background: #651a1a; }

    /* Disabled chat overlay */
    .chat-disabled {
      pointer-events: none;
      opacity: 0.35;
      user-select: none;
    }

    #session-prompt {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      font-size: 13px;
    }

    /* ── Messages ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scrollbar-width: thin;
      scrollbar-color: #2a2a33 transparent;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-thumb { background: #2a2a33; border-radius: 4px; }

    .bubble-row {
      display: flex;
      width: 100%;
    }

    .bubble-row.user { justify-content: flex-end; }
    .bubble-row.assistant { justify-content: flex-start; }

    .bubble {
      max-width: 68%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.55;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .bubble-row.user .bubble {
      background: #2b2320;
      border-bottom-right-radius: 4px;
      color: #f0f0f0;
    }

    .bubble-row.assistant .bubble {
      background: #1a1d26;
      border-bottom-left-radius: 4px;
      color: #e8e8e8;
    }

    /* Status / thinking bubble */
    .bubble.status {
      background: #1a1d26;
      color: #999;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
    }

    .bubble.status .dot-pulse {
      display: flex;
      gap: 3px;
    }

    .bubble.status .dot-pulse span {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #666;
      animation: pulse 1.2s ease-in-out infinite;
    }

    .bubble.status .dot-pulse span:nth-child(2) { animation-delay: 0.2s; }
    .bubble.status .dot-pulse span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.85); }
      40% { opacity: 1; transform: scale(1); }
    }

    /* Badge for cache / faq / rejected */
    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      margin-bottom: 4px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .badge.cache { background: #1a3a2a; color: #4caf8a; }
    .badge.faq { background: #1a2a3a; color: #6ab0f3; }
    .badge.rejected { background: #3a1a1a; color: #cf6679; }

    /* ── Input area ── */
    #input-area {
      flex-shrink: 0;
      padding: 12px 16px 16px;
    }

    .input-box {
      background: #141720;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 12px 14px 40px;
      position: relative;
    }

    #user-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #e8e8e8;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      line-height: 1.5;
      min-height: 48px;
      max-height: 160px;
    }

    #user-input::placeholder { color: #4a4a5a; }

    .input-footer {
      position: absolute;
      bottom: 10px;
      left: 14px;
      right: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .hint {
      font-size: 11px;
      color: #44445a;
      user-select: none;
    }

    #send-btn {
      background: #7a1f1f;
      border: none;
      border-radius: 9px;
      color: #f0e8e8;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 18px;
      cursor: pointer;
      transition: background 0.15s;
      font-family: inherit;
    }

    #send-btn:hover { background: #8f2525; }
    #send-btn:active { background: #651a1a; }
    #send-btn:disabled { background: #3a2020; color: #6a5050; cursor: not-allowed; }
  </style>
</head>
<body>

<header>
  <span class="brain-icon">🧠</span>
  <h1>Memory Agent</h1>
  <div class="session-bar">
    <label>Session</label>
    <input id="session-id" type="text" value="web_session" placeholder="session id" />
    <label>User</label>
    <input id="user-id" type="text" value="web_user" placeholder="user id" />
    <button id="ok-btn">OK</button>
  </div>
</header>

<div class="page-wrapper">
<div id="session-prompt">Enter a Session ID and User ID above, then click OK to start chatting.</div>
<div id="messages" style="display:none"></div>

<div id="input-area" class="chat-disabled">
  <div class="input-box">
    <textarea id="user-input" rows="2" placeholder="Message the agent..."></textarea>
    <div class="input-footer">
      <span class="hint">Press Enter to send</span>
      <button id="send-btn">Send</button>
    </div>
  </div>
</div>
</div>

<script>
  const messagesEl   = document.getElementById('messages');
  const inputEl      = document.getElementById('user-input');
  const sendBtn      = document.getElementById('send-btn');
  const sessionEl    = document.getElementById('session-id');
  const userEl       = document.getElementById('user-id');
  const okBtn        = document.getElementById('ok-btn');
  const inputArea    = document.getElementById('input-area');
  const sessionPrompt = document.getElementById('session-prompt');

  let busy = false;
  let sessionConfirmed = false;

  function confirmSession() {
    if (!sessionEl.value.trim() || !userEl.value.trim()) {
      sessionEl.style.borderColor = sessionEl.value.trim() ? '' : '#7a1f1f';
      userEl.style.borderColor    = userEl.value.trim()    ? '' : '#7a1f1f';
      return;
    }
    sessionEl.style.borderColor = '';
    userEl.style.borderColor    = '';
    sessionEl.readOnly = true;
    userEl.readOnly    = true;
    sessionConfirmed   = true;

    sessionPrompt.style.display = 'none';
    messagesEl.style.display    = 'flex';
    inputArea.classList.remove('chat-disabled');
    okBtn.textContent  = 'Reset';
    inputEl.focus();
  }

  function resetSession() {
    sessionEl.readOnly = false;
    userEl.readOnly    = false;
    sessionConfirmed   = false;

    messagesEl.innerHTML        = '';
    messagesEl.style.display    = 'none';
    sessionPrompt.style.display = 'flex';
    inputArea.classList.add('chat-disabled');
    okBtn.textContent = 'OK';
    sessionEl.focus();
  }

  okBtn.addEventListener('click', () => {
    sessionConfirmed ? resetSession() : confirmSession();
  });

  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addBubble(role, text, source) {
    const row = document.createElement('div');
    row.className = `bubble-row ${role}`;

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    const BADGE_LABELS = { cache: 'Cached', faq: 'FAQ', rejected: 'Blocked' };
    if (source && source !== 'llm') {
      const badge = document.createElement('div');
      badge.className = `badge ${source}`;
      badge.textContent = BADGE_LABELS[source] || source;
      bubble.appendChild(badge);
    }

    const textNode = document.createElement('span');
    textNode.textContent = text;
    bubble.appendChild(textNode);

    row.appendChild(bubble);
    messagesEl.appendChild(row);
    scrollBottom();
    return row;
  }

  function addThinking() {
    const row = document.createElement('div');
    row.className = 'bubble-row assistant';
    row.innerHTML = `
      <div class="bubble status">
        <span>Thinking</span>
        <div class="dot-pulse">
          <span></span><span></span><span></span>
        </div>
      </div>`;
    messagesEl.appendChild(row);
    scrollBottom();
    return row;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || busy) return;

    busy = true;
    sendBtn.disabled = true;
    inputEl.value = '';
    inputEl.style.height = 'auto';

    addBubble('user', text);

    const thinkingRow = addThinking();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: text,
          session_id: sessionEl.value || 'web_session',
          user_id:    userEl.value    || 'web_user',
        }),
      });

      thinkingRow.remove();

      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: res.statusText }));
        addBubble('assistant', `Error: ${err.detail}`, 'rejected');
      } else {
        const data = await res.json();
        addBubble('assistant', data.response, data.source);
      }
    } catch (e) {
      thinkingRow.remove();
      addBubble('assistant', `Network error: ${e.message}`, 'rejected');
    }

    busy = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }

  // Auto-resize textarea
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
  });

  // Enter to send, Shift+Enter for newline
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);
  inputEl.focus();
</script>
</body>
</html>
